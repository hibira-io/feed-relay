name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...
  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: v
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      # Pull requests only build; pushes to main publish :main and :sha-<commit>.
      # Releases publish :<version> and :latest (release.yml).
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ github.event_name == 'push' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ github.event_name == 'push' }}
          build-args: VERSION=main-${{ steps.v.outputs.short }}
          labels: org.opencontainers.image.source=https://github.com/hibira-io/feed-relay
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/hibira-io/feed-relay:main
            ghcr.io/hibira-io/feed-relay:sha-${{ steps.v.outputs.short }}
